name: Verify frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check browser scripts and deployment config
        run: |
          node --check web/prompts.js
          node --check web/api.js
          node --check web/generation.js
          node --check web/app.js
          node --test tests/generation.test.cjs
          node -e "const fs = require('node:fs'); const config = JSON.parse(fs.readFileSync('esa.jsonc', 'utf8')); if (!fs.statSync(config.assets.directory + '/index.html').isFile()) process.exit(1);"
