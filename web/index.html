<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#efeee7" />
    <title>EasyKig Studio · 头壳与拆件</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="./"
        ><span class="brand-symbol">e</span>EasyKig <span>Studio</span></a
      >
      <div class="header-actions">
        <span id="saveState" role="status"></span
        ><button id="settingsOpen" class="quiet">
          连接设置 <span id="connectionDot" class="connection-dot"></span>
        </button>
      </div>
    </header>
    <main>
      <div class="heading">
        <div>
          <h1>角色头壳工作流<span class="accent-dot">.</span></h1>
        </div>
        <p class="heading-note">逐步确认设计，再提取独立部件。</p>
      </div>
      <nav id="pipeline" class="pipeline" aria-label="工作流步骤"></nav>
      <section class="workspace" aria-labelledby="workspaceTitle">
        <header class="workspace-heading">
          <div>
            <span id="stepLabel" class="eyebrow"></span>
            <h2 id="workspaceTitle"></h2>
          </div>
          <div class="workspace-actions">
            <button id="download" class="quiet" disabled>下载选中图片 ↗</button
            ><button id="run" class="primary">
              生成当前步骤 <span>→</span>
            </button>
          </div>
        </header>
        <div id="mobilePreview" class="mobile-preview"></div>
        <nav class="mobile-tabs" aria-label="步骤工作区">
          <button data-tab="references" class="active">参考图</button
          ><button data-tab="prompt">提示词与设置</button
          ><button data-tab="results">生成结果</button>
        </nav>
        <div class="workspace-body" data-view="references">
          <section class="reference-pane" id="referencePane">
            <div class="panel-title">
              <h3>输入参考</h3>
              <span id="inputCount"></span>
            </div>
            <label id="carryWrap" class="check"
              ><input type="checkbox" id="carry" />使用上一步选中的结果</label
            >
            <div id="carried" class="carried"></div>
            <label id="dropZone" class="drop-zone" tabindex="0"
              ><input
                type="file"
                id="upload"
                accept="image/png,image/jpeg,image/webp"
                multiple
                hidden
              /><span class="upload-icon">＋</span
              ><strong>拖入图片，或点击添加</strong
              ><span>PNG / JPEG / WebP · 每张至多 20 MB</span></label
            >
            <div id="uploads" class="uploads"></div>
          </section>
          <section class="prompt-pane" id="promptPane">
            <div class="panel-title">
              <h3>提示词与生成设置</h3>
              <button id="resetPrompt" class="text-button">恢复模板</button>
            </div>
            <div id="splitControl" class="split-control" hidden>
              <span>提取部件</span>
              <div class="segmented">
                <button data-part="face" class="active">前脸</button
                ><button data-part="ornament">头饰</button>
              </div>
            </div>
            <label class="field" id="presetWrap"
              >提示词模板<select id="preset"></select
            ></label>
            <label class="field prompt-label"
              >提示词<textarea
                id="prompt"
                rows="9"
                spellcheck="false"
              ></textarea>
            </label>
            <label class="field"
              >本次修改要求<textarea
                id="notes"
                rows="2"
                placeholder="例如，指定画面左侧的蓝色花饰，保持材质和配色。"
              ></textarea>
            </label>
            <div class="generation-settings">
              <label class="field"
                >尺寸<select id="size">
                  <option value="1024x1024">1024 × 1024</option>
                  <option value="1536x1024">1536 × 1024</option>
                  <option value="1024x1536">1024 × 1536</option>
                  <option value="auto">自动</option>
                </select></label
              ><label class="field"
                >质量<select id="quality">
                  <option value="high">高</option>
                  <option value="medium">中</option>
                  <option value="low">低</option>
                  <option value="auto">自动</option>
                </select></label
              ><label class="field"
                >数量<input type="number" id="count" value="1" min="1" max="4"
              /></label>
            </div>
          </section>
          <section class="results-pane" id="resultsPane">
            <div class="panel-title">
              <h3>生成结果</h3>
              <span id="resultCount"></span>
            </div>
            <p id="stageMessage" role="status"></p>
            <div id="results" class="results"></div>
          </section>
        </div>
      </section>
      <footer>
        <span>EasyKig Studio</span><span>图像生成与部件设计</span
        ><a
          href="https://github.com/YuiLu/ai-kigurumi-head-split"
          target="_blank"
          rel="noreferrer"
          >项目与许可 ↗</a
        >
      </footer>
    </main>
    <dialog id="settingsDialog">
      <form id="connectionForm">
        <div class="dialog-head">
          <h2>连接图像服务</h2>
          <button
            type="button"
            id="settingsClose"
            class="close"
            aria-label="关闭"
          >
            ×
          </button>
        </div>
        <label class="field"
          >API Base URL<input
            id="apiBase"
            type="url"
            placeholder="https://api.openai.com/v1"
            required /></label
        ><label class="field"
          >API Key<input
            id="apiKey"
            type="password"
            autocomplete="off"
            required /></label
        ><label class="field"
          >图像模型<input
            id="imageModel"
            type="text"
            value="gpt-image-2"
            required
            list="modelList" /><datalist id="modelList">
            <option value="gpt-image-2"></option>
            <option value="gemini-2.5-flash-image"></option>
            <option value="gemini-3-pro-image-preview"></option></datalist
        ></label>
        <p class="settings-help">
          连接信息保存在此浏览器。生成请求发送到所填的服务地址。Gemini
          模型使用原生 generateContent 接口。
        </p>
        <button class="primary" type="submit">保存连接设置</button>
      </form>
    </dialog>
    <dialog id="imageDialog" class="image-dialog">
      <button id="imageClose" class="close" aria-label="关闭预览">×</button
      ><img id="largeImage" alt="大图预览" />
    </dialog>
    <div id="toast" class="toast" role="status" hidden></div>
    <script src="prompts.js"></script>
    <script src="api.js"></script>
    <script src="app.js"></script>
  </body>
</html>
